try{$('#cv').innerHTML=CS[C.tab]()}catch(e){$('#cv').innerHTML='<div class="emp">Erro ao exibir esta aba.</div>';console.error(e)}$('#cv').scrollTop=(C.tab=='chat'&&newMsg)?1e9:sc;if(P.tab=='ch'&&newMsg)$('#pv').scrollTop=1e9;document.querySelectorAll('.clinic>.ov').forEach(e=>e.remove());if(ROLE=='c'&&!STAFF)$('.clinic').insertAdjacentHTML('beforeend',loginUI());if(aid){const e=$('#'+aid);if(e){e.value=av;e.focus()}}lastCH=CH.length;$('#ck').textContent=ROLE=='c'?(Object.values(PAT).filter(Boolean).length+' paciente(s) cadastrado(s)'):(D.profile?'Paciente: '+D.profile.name+' · CPF '+fmtCpf(D.profile.cpf):'')}
function reset(){D=DEF();save();if(DBX)CH.forEach(m=>DBX.collection('chat').doc(m.id).delete().catch(()=>{}));else{CH=[];try{localStorage.removeItem('fvch_'+ROLE)}catch(e){}}Object.assign(P,{tab:'home',cart:{},slot:'',ls:[],lslot:'',view:null});prevN=seenN=D.notifs.length;R()}
addEventListener('storage',e=>{if(e.key=='fvsim_'+ROLE){try{D=JSON.parse(e.newValue)||DEF();R()}catch(x){}}});
setV('p');
seenN=0;R();prevN=D.notifs.length;
/* ===== SUPABASE multi-paciente ===== */
const SUPA=window.SUPA_CONFIG||{url:'',key:''};
const COLS=['appts','orders','labs','manips','notifs','log'];
const sj=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const SORT=c=>{const d=c=='notifs'||c=='log';D[c].sort((a,b)=>d?b.ts-a.ts:a.ts-b.ts)};
const cfgErr=()=>!window.supabase?'⚪ Biblioteca do Supabase não carregou (verifique a internet)':!window.SUPA_CONFIG?'⚪ supabase-config.js não encontrado (mesma pasta do index.html)':(!SUPA.url.startsWith('https://')||SUPA.key.startsWith('COLE'))?'⚪ Preencha a URL e a chave em supabase-config.js':'';
const makeSB=k=>supabase.createClient(SUPA.url,SUPA.key,{auth:{storageKey:k,persistSession:true,autoRefreshToken:true}});
const OKID=/^[A-Za-z0-9_-]{1,64}$/;
function applyRow(r,del){if(!r||!OKID.test(String(r.id))||!r.col)return;if(ROLE=='p'&&r.owner!=UID)return;const k=r.owner+'|'+r.col+'|'+r.id;
if(r.col=='chat'){if(del)CH=CH.filter(m=>m.id!=r.id);else if(!CH.some(m=>m.id==r.id))CH.push({...r.data,id:r.id,owner:r.owner,ts:r.ts});CH.sort((a,b)=>a.ts-b.ts);return}
if(r.col=='profile'){const p=del?null:r.data;PAT[r.owner]=p;if(ROLE=='p'){D.profile=p;if(p)SYNC[k]=sj(p);else delete SYNC[k]}return}
if(!COLS.includes(r.col)||(ROLE=='c'&&r.col=='notifs'))return;
const a=D[r.col],i=a.findIndex(x=>x.id==r.id);if(del){if(i>=0)a.splice(i,1);delete SYNC[k];return}
const it={...r.data,id:r.id,ts:r.ts};SYNC[k]=sj(it);if(ROLE=='c')it.owner=r.owner;i>=0?a[i]=it:a.push(it);SORT(r.col)}
async function syncUp(){if(!SB||!UID||!LOADED||(ROLE=='c'&&!STAFF))return;const now=Date.now(),ups=[],seen=new Set();
const add=(own,col,it,raw)=>{if(!own)return;const{owner:_,...data}=it,id=String(raw||it.id),k=own+'|'+col+'|'+id;seen.add(k);const js=sj(data);if(SYNC[k]!==js){SYNC[k]=js;ups.push({owner:own,col,id,data,ts:it.ts||0})}};
COLS.forEach(c=>(D[c]||[]).forEach(it=>{if(!it.id)it.id=uid();if(!it.ts)it.ts=now;add(ROLE=='p'?UID:it.owner,c,it)}));
if(ROLE=='p'&&D.profile)add(UID,'profile',D.profile,'me');
const dels=Object.keys(SYNC).filter(k=>!seen.has(k)&&(ROLE=='c'||k.startsWith(UID+'|')));
try{if(ups.length){const r=await SB.from('docs').upsert(ups,{onConflict:'owner,col,id'});if(r.error)throw r.error}
for(const k of dels){const[o,c,...i]=k.split('|');const r=await SB.from('docs').delete().eq('owner',o).eq('col',c).eq('id',i.join('|'));if(r.error)throw r.error;delete SYNC[k]}
setSy(1);if(ROLE=='p')refreshBusy()}catch(e){console.error(e);ups.forEach(u=>delete SYNC[u.owner+'|'+u.col+'|'+u.id]);setSy(0);toast('⚠ Falha ao sincronizar')}}
async function refreshBusy(){if(!SB)return;try{const r=await SB.from('busy_slots').select('*');if(r.error)return;const n=sj(r.data);if(n!==BUSYJ){BUSYJ=n;BUSY.appts=r.data.filter(x=>x.col=='appts');BUSY.labs=r.data.filter(x=>x.col=='labs');R()}}catch(e){}}
async function loadAll(){D=DEF();CH=[];Object.keys(SYNC).forEach(k=>delete SYNC[k]);Object.keys(PAT).forEach(k=>delete PAT[k]);let q=SB.from('docs').select('*').order('ts').limit(5000);if(ROLE=='c')q=q.neq('col','notifs');const r=await q;if(r.error)throw r.error;r.data.forEach(x=>applyRow(x));LOADED=true;if(ROLE=='p')await refreshBusy()}
function subscribe(){SB.channel('docs-'+ROLE).on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{const del=p.eventType=='DELETE';applyRow(del?p.old:p.new,del);try{localStorage.setItem('fvsim_'+ROLE,JSON.stringify(D))}catch(e){}R();if(ROLE=='p'&&!del&&['appts','labs'].includes(p.new.col))refreshBusy()}).subscribe(s=>{if(s=='SUBSCRIBED')setSy(1)})}
async function initPatient(){SB=makeSB('fv-patient-auth');let{data:{session}}=await SB.auth.getSession();if(!session){const r=await SB.auth.signInAnonymously();if(r.error){$('#sy').textContent='⚪ Ative "Anonymous sign-ins" no Supabase (Authentication > Sign In / Providers)';READY=true;R();return}session=r.data.session}
UID=session.user.id;await loadAll();subscribe();READY=true;setSy(1);R();setInterval(refreshBusy,15000)}
async function enter(u){UID=u.id;const r=await SB.from('staff').select('uid').eq('uid',UID).maybeSingle();if(!r.data){L.err='Esta conta não faz parte da equipe da clínica (rode o passo do SQL que cadastra o funcionário).';await SB.auth.signOut();UID=null;R();return}STAFF=true;await loadAll();subscribe();setSy(1);R()}
async function initClinic(){SB=makeSB('fv-clinic-auth');const{data:{session}}=await SB.auth.getSession();if(session)await enter(session.user);else R()}
async function clinicLogin(){L.err='';const r=await SB.auth.signInWithPassword({email:L.e.trim(),password:L.p});if(r.error){L.err='E-mail ou senha incorretos.';R();return}L.p='';await enter(r.data.user)}
async function clinicOut(){try{await SB.auth.signOut()}catch(e){}location.reload()}
function loginUI(){return `<div class="ov" style="align-items:center;background:var(--sf)"><div class="sheet" style="background:none;width:100%;max-width:360px;margin:auto;text-align:center"><div class="br" style="font-size:24px">Farma <span style="color:#7aa84a">&amp;</span> <i>Vida</i></div><h2 style="margin-top:12px">Entrar na clínica</h2><p style="font-size:12px;color:var(--red);min-height:16px">${esc(L.err)}</p><div style="display:flex;flex-direction:column;gap:8px"><input id="le" ${IN} type="email" placeholder="E-mail" value="${esc(L.e)}" oninput="L.e=this.value"><input id="lp" ${IN} type="password" placeholder="Senha" value="${esc(L.p)}" oninput="L.p=this.value" onkeydown="if(event.key=='Enter')clinicLogin()"></div><button class="bt" onclick="clinicLogin()">Entrar</button></div></div>`}
function PATS(){return Object.keys(PAT).filter(o=>PAT[o]).map(o=>`<div class="cd c"><span class="ic">👤</span><div class="t"><b>${esc(PAT[o].name)}</b><small>CPF ${esc(fmtCpf(PAT[o].cpf))} · ${D.appts.filter(a=>a.owner==o).length} consulta(s) · ${D.orders.filter(x=>x.owner==o).length} pedido(s)</small></div></div>`).join('')||'<div class="emp">Nenhum paciente cadastrado ainda.</div>'}
(async()=>{const why=cfgErr();if(why){$('#sy').textContent=why;READY=true;R();return}try{ROLE=='p'?await initPatient():await initClinic()}catch(e){console.error(e);setSy(0);READY=true;R()}})();
</script></body></html>
