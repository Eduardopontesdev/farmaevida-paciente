for(const k of dels){const[o,c,...i]=k.split('|');const r=await SB.from('docs').delete().eq('owner',o).eq('col',c).eq('id',i.join('|'));if(r.error)throw r.error;delete SYNC[k]}
setSy(1);if(ROLE=='p')refreshBusy()}catch(e){console.error(e);ups.forEach(u=>delete SYNC[u.owner+'|'+u.col+'|'+u.id]);setSy(0);toast('⚠ Falha ao sincronizar')}}
async function refreshBusy(){if(!SB)return;try{const r=await SB.from('busy_slots').select('*');if(r.error)return;const n=sj(r.data);if(n!==BUSYJ){BUSYJ=n;BUSY.appts=r.data.filter(x=>x.col=='appts');BUSY.labs=r.data.filter(x=>x.col=='labs');R()}}catch(e){}}
async function loadAll(){D=DEF();CH=[];Object.keys(SYNC).forEach(k=>delete SYNC[k]);Object.keys(PAT).forEach(k=>delete PAT[k]);let q=SB.from('docs').select('*').order('ts').limit(5000);if(ROLE=='c')q=q.neq('col','notifs');const r=await q;if(r.error)throw r.error;r.data.forEach(x=>applyRow(x));LOADED=true;await loadCat();await loadAlerts();if(ROLE=='p')await refreshBusy()}
function subscribe(){SB.channel('docs-'+ROLE).on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{const del=p.eventType=='DELETE';applyRow(del?p.old:p.new,del);try{localStorage.setItem('fvsim_'+ROLE,JSON.stringify(D))}catch(e){}R();if(ROLE=='p'&&!del&&['appts','labs'].includes(p.new.col))refreshBusy()}).on('postgres_changes',{event:'*',schema:'public',table:'catalog'},()=>loadCat().then(R)).on('postgres_changes',{event:'*',schema:'public',table:'alerts'},()=>loadAlerts().then(R)).subscribe(s=>{if(s=='SUBSCRIBED')setSy(1)})}
async function initPatient(){SB=makeSB('fv-patient-auth');let{data:{session}}=await SB.auth.getSession();if(!session){const r=await SB.auth.signInAnonymously();if(r.error){$('#sy').textContent='⚪ Ative "Anonymous sign-ins" no Supabase (Authentication > Sign In / Providers)';READY=true;R();return}session=r.data.session}
UID=session.user.id;try{const m=await SB.rpc('my_owner');if(m&&m.data)UID=m.data}catch(e){}await loadAll();subscribe();READY=true;setSy(1);R();setInterval(refreshBusy,15000)}
async function enter(u){UID=u.id;const r=await SB.from('staff').select('uid').eq('uid',UID).maybeSingle();if(!r.data){L.err='Esta conta não faz parte da equipe da clínica (rode o passo do SQL que cadastra o funcionário).';await SB.auth.signOut();UID=null;R();return}STAFF=true;await loadAll();subscribe();setSy(1);R()}
async function initClinic(){SB=makeSB('fv-clinic-auth');const{data:{session}}=await SB.auth.getSession();if(session)await enter(session.user);else R()}
async function clinicLogin(){L.err='';const r=await SB.auth.signInWithPassword({email:L.e.trim(),password:L.p});if(r.error){L.err='E-mail ou senha incorretos.';R();return}L.p='';await enter(r.data.user)}
async function clinicOut(){try{await SB.auth.signOut()}catch(e){}location.reload()}
function loginUI(){return `<div class="ov" style="align-items:center;background:var(--sf)"><div class="sheet" style="background:none;width:100%;max-width:360px;margin:auto;text-align:center"><div class="br" style="font-size:24px">Farma <span style="color:#7aa84a">&amp;</span> <i>Vida</i></div><h2 style="margin-top:12px">Entrar na clínica</h2><p style="font-size:12px;color:var(--red);min-height:16px">${esc(L.err)}</p><div style="display:flex;flex-direction:column;gap:8px"><input id="le" ${IN} type="email" placeholder="E-mail" value="${esc(L.e)}" oninput="L.e=this.value"><input id="lp" ${IN} type="password" placeholder="Senha" value="${esc(L.p)}" oninput="L.p=this.value" onkeydown="if(event.key=='Enter')clinicLogin()"></div><button class="bt" onclick="clinicLogin()">Entrar</button></div></div>`}
function PATS(){return Object.keys(PAT).filter(o=>PAT[o]).map(o=>`<div class="cd c"><span class="ic">👤</span><div class="t"><b>${esc(PAT[o].name)}</b><small>CPF ${esc(fmtCpf(PAT[o].cpf))} · ${D.appts.filter(a=>a.owner==o).length} consulta(s) · ${D.orders.filter(x=>x.owner==o).length} pedido(s) · ${D.meds.filter(x=>x.owner==o).length} medicamento(s)</small></div></div>`).join('')||'<div class="emp">Nenhum paciente cadastrado ainda.</div>'}
(async()=>{const why=cfgErr();if(why){$('#sy').textContent=why;READY=true;R();return}try{ROLE=='p'?await initPatient():await initClinic()}catch(e){console.error(e);setSy(0);READY=true;R()}})();
</script></body></html>
